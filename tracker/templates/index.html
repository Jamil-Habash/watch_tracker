<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Your Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
<script src="{% static 'script.js' %}?v=20260808" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="marquee">
      <h1>YOUR LOG</h1>
      <p class="tagline">every movie, show, and anime — stamped as you go</p>
    </div>
  </header>

  <section class="stats-strip" id="statsStrip"></section>

  <section class="controls">
    <div class="type-tabs" id="typeTabs">
      <button class="tab active" data-type="all">All</button>
      <button class="tab" data-type="movie">Movies</button>
      <button class="tab" data-type="tv">TV</button>
      <button class="tab" data-type="anime">Anime</button>
    </div>
    <div class="secondary-row">
      <input id="searchInput" placeholder="Search titles…" autocomplete="off">
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="watching">Watching</option>
        <option value="completed">Completed</option>
        <option value="planned">Plan to watch</option>
      </select>
    </div>
  </section>

  <section class="list" id="entryList">
    <div class="loading">loading your log…</div>
  </section>
</div>

<button class="fab" id="addBtn" aria-label="Add title">+</button>

<div class="modal-overlay" id="modalOverlay">
  <form class="modal" id="entryForm">
    <h2 id="modalTitle">Add a title</h2>
    <input type="hidden" id="entryId">

    <div class="field">
      <label>Type</label>
      <div class="type-picker" id="typePicker">
        <button type="button" data-v="movie" class="sel">Movie</button>
        <button type="button" data-v="tv">TV Series</button>
        <button type="button" data-v="anime">Anime</button>
      </div>
    </div>

    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" required placeholder="e.g. Parasite">
    </div>

    <div class="row2">
      <div class="field">
        <label>Year</label>
        <input type="text" id="fYear" placeholder="2019" inputmode="numeric">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="fStatus">
          <option value="completed">Completed</option>
          <option value="watching">Watching</option>
          <option value="planned">Plan to watch</option>
        </select>
      </div>
    </div>

    <div class="row2" id="episodeRow" style="display:none;">
      <div class="field">
        <label>Episode</label>
        <input type="number" id="fEpCurrent" min="0" placeholder="0">
      </div>
      <div class="field">
        <label>Total eps</label>
        <input type="number" id="fEpTotal" min="0" placeholder="?">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Rating (0–10)</label>
        <input type="number" id="fRating" min="0" max="10" step="0.1" placeholder="—">
      </div>
      <div class="field">
        <label>Date watched</label>
        <input type="date" id="fDate">
      </div>
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Thoughts, who you watched it with, anything worth remembering…"></textarea>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </form>
</div>
</body>
</html>
