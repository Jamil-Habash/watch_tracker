<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Your Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,wght@0,500;1,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p>Access your watch log and manage saved movies, TV, and anime.</p>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="auth-field">
          <label for="id_username">Username</label>
          <input type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="auth-field">
          <label for="id_password">Password</label>
          <input type="password" name="password" id="id_password" required>
        </div>
        <div class="auth-actions">
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
      </form>
      {% if form.errors %}
      <div class="auth-footer" style="color:#e2a3a3;border-top:none;padding-top:0;margin-top:0;">
        Please check your username and password.
      </div>
      {% endif %}
      <div class="auth-footer">
        Don't have an account? <a href="{% url 'signup' %}">Create one</a>.
      </div>
    </div>
  </div>
</body>
</html>
